name: CI
on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - run: mise run setup
      - run: mise run verify
      - name: Every file carries a licence and a copyright
        run: mise run reuse
      - name: The release configuration builds every binary, archive and SBOM
        run: mise exec -- goreleaser release --snapshot --clean --skip=sign,publish
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco-check.sh "$BASE" "$HEAD"
  admission:
    name: admission (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.30"
            node-image: kindest/node:v1.30.13@sha256:397209b3d947d154f6641f2d0ce8d473732bd91c87d9575ade99049aa33cd648
          - kubernetes: "1.37"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    env:
      # renovate: datasource=github-releases depName=external-secrets/external-secrets
      ESO_VERSION: 2.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - name: Start a disposable cluster at the oldest and newest supported Kubernetes
        env:
          NODE_IMAGE: ${{ matrix.node-image }}
        run: mise exec -- kind create cluster --name wellhead --image "$NODE_IMAGE" --wait 180s
      - name: The API server warns about, then refuses, each fail fixture by its own rule and admits every pass fixture
        run: mise run admission
  gate:
    if: always()
    needs: [verify, dco, admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job passed; dco is skipped only outside pull requests
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries | all(
              .value.result == "success"
              or (.key == "dco" and $event != "pull_request" and .value.result == "skipped")
            )'

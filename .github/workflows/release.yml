name: Release
on:
  push:
    branches: [main, development]
permissions:
  contents: read
concurrency:
  group: wellhead-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cut:
    if: github.repository == 'wellhead-dev/wellhead'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.semantic-release.outputs.tag }}
    container:
      image: ghcr.io/webgrip/semantic-release:2.1.2@sha256:1fd0856cbfe52386712060bda1d84b9efa3de3d903d1754914d8cf6486d6fd37
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Cut a candidate on development or a stable release on main
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: semantic-release
  publish:
    needs: cut
    if: needs.cut.outputs.tag != ''
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}

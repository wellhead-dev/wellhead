version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - revive
    - staticcheck
    - errcheck
    - govet
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
        - name: unused-parameter
  exclusions:
    rules:
      # wellhead reads the files a person names: manifests, a kubeconfig, a CA, a FIELD=@FILE value.
      - text: "G304|G703"
        linters:
          - gosec
      - path: _test\.go
        linters:
          - gosec
formatters:
  enable:
    - gofmt

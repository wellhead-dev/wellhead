[settings]
lockfile = true

[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
goreleaser = "2.19.0"
cosign = "3.1.4"
helm = "4.3.0"
"aqua:anchore/syft" = "1.54.1"
"aqua:kubernetes-sigs/kind" = "0.33.0"
"aqua:kubernetes/kubectl" = "1.36.1"
"aqua:kyverno/kyverno" = "1.19.2"
"aqua:mikefarah/yq" = "4.54.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
uv = "0.12.22"

[tasks.setup]
run = "mise install"
description = "Install the pinned toolchain"

[tasks.verify]
run = "bash scripts/verify.sh"
description = "Format, vet, build, test, lint, and check the chart and its policy offline"

[tasks.admission]
run = "bash scripts/admission-test.sh"
description = "Run the policy fixtures against a live API server (needs a cluster in the current context)"

[tasks.reuse]
run = "uv tool run --from 'reuse[charset-normalizer]==6.2.0' reuse lint"
description = "Check every file carries a licence and copyright"

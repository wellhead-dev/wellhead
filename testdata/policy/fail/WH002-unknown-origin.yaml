apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bad-origin
  namespace: default
  annotations:
    wellhead.dev/origin: generated
spec:
  refreshInterval: "0"
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: bad-origin }
  data:
    - { secretKey: token, remoteRef: { key: apps/demo, property: token } }

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-http
  namespace: default
  annotations:
    wellhead.dev/origin: provided
    wellhead.dev/how: Vendor console, API tokens, create a read-only token.
    wellhead.dev/verify: none
    wellhead.dev/docs: http://example.com/runbook
spec:
  refreshInterval: "0"
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: docs-http }
  data:
    - { secretKey: token, remoteRef: { key: apps/demo, property: token } }

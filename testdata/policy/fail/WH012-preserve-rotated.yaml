apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: preserve-rotate
  namespace: default
  annotations:
    wellhead.dev/origin: preserve
    wellhead.dev/how: An at-rest key; generated once.
    wellhead.dev/verify: none
    wellhead.dev/rotate-on-compromise: "true"
spec:
  refreshInterval: "0"
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: preserve-rotate }
  data:
    - { secretKey: token, remoteRef: { key: apps/demo, property: token } }

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
  namespace: default
  annotations:
    wellhead.dev/origin: provided
    wellhead.dev/how: GitHub organisation settings, Developer settings, GitHub Apps, the app, Generate a private key.
    wellhead.dev/fields: app_id installation_id private_key
    wellhead.dev/plain: app_id installation_id
    wellhead.dev/verify: github-app
    wellhead.dev/verify.github-app.permissions: contents:read pull_requests:write
    wellhead.dev/verify.github-app.repositories: example/app example/infra
    wellhead.dev/expires: "2027-10-27"
spec:
  refreshInterval: "0"
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: github-app }
  dataFrom:
    - extract: { key: apps/demo }

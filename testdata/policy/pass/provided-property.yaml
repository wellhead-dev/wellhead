apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: provided-property
  namespace: default
  annotations:
    wellhead.dev/origin: provided
    wellhead.dev/how: Vendor console, API tokens, create a read-only token.
    wellhead.dev/verify: format
    wellhead.dev/verify.format.token: "[A-Za-z0-9_]{20,}"
spec:
  refreshInterval: "0"
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: provided-property }
  data:
    - { secretKey: token, remoteRef: { key: apps/demo, property: token } }
